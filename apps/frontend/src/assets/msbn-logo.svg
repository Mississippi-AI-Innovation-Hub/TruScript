<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90" fill="none">

  <!-- MISSISSIPPI watermark — contained in left 340px -->
  <text
    x="4" y="60"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="42" font-weight="700"
    fill="#cdd1d9" letter-spacing="3"
  >MISSISSIPPI</text>

  <!-- Decorative flourish (stylised interlocking loops) -->
  <g transform="translate(90, 72)" opacity="0.7">
    <ellipse cx="0"  cy="0" rx="13" ry="8" stroke="#b8bec9" stroke-width="2.2" fill="none"/>
    <ellipse cx="20" cy="0" rx="13" ry="8" stroke="#b8bec9" stroke-width="2.2" fill="none"/>
    <ellipse cx="40" cy="0" rx="13" ry="8" stroke="#b8bec9" stroke-width="2.2" fill="none"/>
  </g>

  <!-- Vertical divider -->
  <line x1="348" y1="8" x2="348" y2="82" stroke="#c0c6d0" stroke-width="1.2"/>

  <!-- BOARD -->
  <text
    x="362" y="42"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="24" font-weight="900"
    fill="#1a3a6b" letter-spacing="1"
  >BOARD</text>

  <!-- of -->
  <text
    x="362" y="58"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12" font-weight="400"
    fill="#1a3a6b" letter-spacing="2"
  >of</text>

  <!-- NURSING -->
  <text
    x="362" y="76"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="24" font-weight="900"
    fill="#1a3a6b" letter-spacing="1"
  >NURSING</text>

</svg>
